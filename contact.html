<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Haryana Digital Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Haryana<span>DigitalAgency.</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Let's Build Something Great</h1>
        <p>We operate 100% online to serve you efficiently, anywhere.</p>
    </header>

    <section class="container" style="max-width: 800px;">
        <div class="contact-form">
            <h2 style="margin-bottom: 2rem;">Start a Conversation</h2>
            <form action="https://formspree.io/f/mdeojryn" method="POST">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Project Details</label>
                    <textarea name="message" rows="5" required placeholder="Tell us about your digital marketing goals..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
            </form>
            
            <div style="margin-top: 3rem; text-align: center; padding-top: 2rem; border-top: 1px solid #cbd5e1;">
                <h3>Direct Contact</h3>
                <p style="color: var(--gray); margin-top: 0.5rem;">
                    Email: <a href="mailto:haryanadigitalagency@gmail.com" style="color: var(--primary); text-decoration: none; font-weight: bold;">haryanadigitalagency@gmail.com</a>
                </p>
                <p style="color: var(--gray); font-size: 0.9rem; margin-top: 1rem;">
                    
                </p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Haryana Digital Agency. A Global Online Company.</p>
    </footer>
</body>
</html>
